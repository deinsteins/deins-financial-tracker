name: Deploy

on:
  workflow_dispatch: # Allows manual deployment from Actions tab
  push:
    tags:
      - 'v*'      # Triggers on version tags (e.g. v1.0, v2.1.3)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Check if directory exists and is a git repository
            if [ ! -d "/home/ubuntu/finance-bot/.git" ]; then
              echo "Directory /home/ubuntu/finance-bot does not exist or is not a git repo. Creating and cloning..."
              mkdir -p /home/ubuntu
              if ! git clone https://github.com/deinsteins/deins-financial-tracker.git /home/ubuntu/finance-bot; then
                echo "ERROR: Failed to clone repository. Please check permissions."
                exit 1
              fi
              PREV_COMMIT=""
            else
              cd /home/ubuntu/finance-bot
              PREV_COMMIT=$(git rev-parse HEAD)
            fi
            
            cd /home/ubuntu/finance-bot
            echo "Previous running commit is: $PREV_COMMIT"
            
            # Pull latest changes (only if it wasn't a fresh clone)
            if [ -n "$PREV_COMMIT" ]; then
              echo "Pulling latest changes from master..."
              if ! git pull origin master; then
                echo "ERROR: git pull failed. No changes applied."
                exit 1
              fi
            fi
            
            # Clean up existing conflicting containers with the same names to prevent conflicts
            for name in finance-db-prod finance-ai-service-prod finance-bot-prod; do
              if [ "$(docker ps -a -q -f name=^/${name}$)" ]; then
                echo "Found conflicting container '$name'. Removing it to prevent daemon conflicts..."
                docker rm -f $name
              fi
            done
            
            # Attempt to build and run updated services
            echo "Building and starting production containers..."
            if ! docker compose -f docker-compose.prod.yml up -d --build --remove-orphans; then
              echo "ERROR: Docker build/up failed!"
              if [ -n "$PREV_COMMIT" ]; then
                echo "Rolling back to commit $PREV_COMMIT..."
                git checkout -f $PREV_COMMIT
                docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
              else
                echo "Fresh deployment failed. Cleaning up..."
                docker compose -f docker-compose.prod.yml down -v
              fi
              exit 1
            fi
            
            # Wait for healthchecks to run
            echo "Waiting 15 seconds for containers to initialize..."
            sleep 15
            
            # Validate health status of all containers
            FAILED_HEALTH=0
            for container in $(docker compose -f docker-compose.prod.yml ps -q); do
              STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' $container)
              if [ "$STATUS" != "healthy" ] && [ "$STATUS" != "running" ]; then
                echo "ERROR: Container $container is in state '$STATUS' (unhealthy)!"
                FAILED_HEALTH=1
              else
                echo "Container $container is healthy ($STATUS)."
              fi
            done
            
            # If any container is unhealthy, roll back
            if [ $FAILED_HEALTH -ne 0 ]; then
              echo "ERROR: One or more services failed health checks!"
              if [ -n "$PREV_COMMIT" ]; then
                echo "Rolling back to commit $PREV_COMMIT..."
                git checkout -f $PREV_COMMIT
                docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
              else
                echo "Fresh deployment unhealthy. Cleaning up..."
                docker compose -f docker-compose.prod.yml down -v
              fi
              docker image prune -f
              exit 1
            fi
            
            # Success: clean up old images
            echo "All services verified healthy! Pruning old images..."
            docker image prune -f
            echo "Deployment completed successfully!"
