name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  go-ci:
    name: Go Service (Bot) CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: bot/go.sum

      - name: Install Go Dependencies
        run: |
          cd bot
          go mod download

      - name: Build Go Application
        run: |
          cd bot
          go build -v -o bot-service main.go

      - name: Run Go Tests
        run: |
          cd bot
          go test -v ./...

  python-ci:
    name: Python Service (AI) CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Python Dependencies
        run: |
          cd ai-service
          pip install -r requirements.txt

      - name: Check Python Syntax & Compilation
        run: |
          cd ai-service
          python -m py_compile main.py parser_service.py

  docker-ci:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Local Compose Config
        run: |
          # Set up dummy environment variables for config check
          export DB_PASSWORD=test_pass
          export TELEGRAM_BOT_TOKEN=test_token
          docker compose config

      - name: Validate Production Compose Config
        run: |
          # Set up dummy environment variables for config check
          export DB_PASSWORD=test_pass
          export TELEGRAM_BOT_TOKEN=test_token
          docker compose -f docker-compose.prod.yml config
