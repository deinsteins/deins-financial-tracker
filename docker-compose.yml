version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: finance-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${DB_NAME:-finance_db}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./db/migrations/000002_add_debts.up.sql:/docker-entrypoint-initdb.d/03_debts.sql:ro
      - ./db/migrations/000003_add_debt_reminders.up.sql:/docker-entrypoint-initdb.d/04_debt_reminders.sql:ro
      - ./db/migrations/000004_add_net_worth_tracker.up.sql:/docker-entrypoint-initdb.d/05_net_worth_tracker.sql:ro
      - ./db/migrations/000005_add_cashflow_predictions.up.sql:/docker-entrypoint-initdb.d/06_cashflow_predictions.sql:ro
      - ./db/migrations/000006_add_payday_to_users.up.sql:/docker-entrypoint-initdb.d/07_payday_to_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-finance_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: finance-ai-service
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_secure_pass}@db:5432/${DB_NAME:-finance_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TZ=${TZ:-Asia/Jakarta}
      - ENV=development
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: finance-bot
    ports:
      - "${BOT_PORT:-8080}:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres_secure_pass}
      - DB_NAME=${DB_NAME:-finance_db}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-YOUR_TELEGRAM_BOT_TOKEN_HERE}
      - AI_SERVICE_URL=http://ai-service:8000
      - BOT_PORT=${BOT_PORT:-8080}
      - TZ=${TZ:-Asia/Jakarta}
      - ENV=development
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HERMES_API_URL=${HERMES_API_URL}
      - HERMES_MODEL=${HERMES_MODEL}
      - HERMES_API_KEY=${HERMES_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${BOT_PORT:-8080}/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
