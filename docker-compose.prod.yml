services:
  db:
    image: postgres:15-alpine
    container_name: finance-db-prod
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-finance_db}
      TZ: ${TZ:-Asia/Jakarta}
    # Bind to localhost to prevent public access from the internet
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      # Only run schema migrations; do not mount seed.sql in production
      - ./db/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - finance-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: finance-ai-service-prod
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/${DB_NAME:-finance_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TZ=${TZ:-Asia/Jakarta}
      - ENV=production
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - finance-network

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: finance-bot-prod
    ports:
      - "127.0.0.1:${BOT_PORT:-8080}:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=${DB_NAME:-finance_db}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set}
      - AI_SERVICE_URL=http://ai-service:8000
      - BOT_PORT=${BOT_PORT:-8080}
      - TZ=${TZ:-Asia/Jakarta}
      - ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - HERMES_API_URL=${HERMES_API_URL:-}
      - HERMES_MODEL=${HERMES_MODEL:-}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${BOT_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - finance-network

volumes:
  postgres_data_prod:

networks:
  finance-network:
    driver: bridge
